name: Update melt watch

on:
  schedule:
    - cron: "7 6 * * *"            # all sources, once a day
    - cron: "17 1,7,13,19 * * *"   # station reports, about 1 h after the 00/06/12/18 UTC reports
  workflow_dispatch:
    inputs:
      mode:
        description: "stations, full or rebuild (page only, after a template change)"
        type: choice
        options: [full, stations, rebuild]
        default: full

permissions:
  contents: write

concurrency:
  group: meltwatch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Get the published site (state of the season so far)
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          else
            mkdir site
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -q -r requirements.txt

      - name: Make the update
        id: make
        env:
          MPLBACKEND: Agg
          MELTWATCH_WORK: ${{ runner.temp }}/work
          AMPS_CHANGED_FLAG: ${{ runner.temp }}/site_changed
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "7 6 * * *" ]; then MODE=full; else MODE=stations; fi
          fi
          case "$MODE" in
            full) python publish.py site --full ;;
            rebuild) python publish.py site --rebuild ;;
            *) python publish.py site ;;
          esac
          if [ -f "$AMPS_CHANGED_FLAG" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "Nothing new to publish."; fi

      - name: Publish (gh-pages keeps a single commit, so the repository stays small)
        if: steps.make.outputs.changed == 'true'
        run: |
          cd site
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "meltwatch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Melt watch $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
